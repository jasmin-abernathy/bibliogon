<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
    <meta name="theme-color" content="#4f7a57"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <title>Atelier EPUB</title>
    <meta name="description" content="Atelier EPUB - an open-source, local-first workspace to create books and simplify PDFs into editable ebook structure."/>
    <meta name="keywords" content="EPUB, ebook editor, PDF import, self-publishing, local-first, open source"/>
    <meta name="author" content="Asterios Raptis"/>
    <link rel="canonical" href="https://astrapi69.github.io/bibliogon/"/>
    <!-- Open Graph -->
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Atelier EPUB - local-first ebook workshop"/>
    <meta property="og:description" content="Create books and simplify layout-heavy PDFs into editable ebook structure, locally in your browser."/>
    <meta property="og:image" content="https://astrapi69.github.io/bibliogon/og-image.png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:url" content="https://astrapi69.github.io/bibliogon/"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:site_name" content="Atelier EPUB"/>
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Atelier EPUB - local-first ebook workshop"/>
    <meta name="twitter:description" content="Create books and simplify PDFs into editable ebook structure, locally in your browser."/>
    <meta name="twitter:image" content="https://astrapi69.github.io/bibliogon/og-image.png"/>
    <!-- Structured data: the app itself (schema.org WebApplication) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Atelier EPUB",
      "description": "Open-source local-first ebook workshop",
      "url": "https://astrapi69.github.io/bibliogon/",
      "applicationCategory": "Productivity",
      "operatingSystem": "Web, Windows, Linux, macOS",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      }
    }
    </script>
    <!-- Fonts are bundled locally in public/fonts/ (no CDN dependency) -->
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
