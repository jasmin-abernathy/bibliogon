name: Publish fork preview branch

# Builds Jasmin's fork as an offline/local-first preview and publishes the
# compiled site to this repository's gh-pages branch.
#
# First-time GitHub Pages setup: in Settings > Pages, choose gh-pages / (root).
# After that one-time selection, every push to develop updates the preview
# automatically at https://jasmin-abernathy.github.io/bibliogon/.

on:
  # Preview publication is deliberate. Use "Run workflow" from develop or push
  # a preview-* tag when a fresh hosted preview is actually useful.
  workflow_dispatch:
  push:
    tags:
      - "preview-*"

permissions:
  contents: write

concurrency:
  group: fork-preview-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    if: github.repository == 'jasmin-abernathy/bibliogon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (base /bibliogon/, offline Dexie storage)
        working-directory: ./frontend
        env:
          VITE_BASE_URL: /bibliogon/
          VITE_STORAGE_MODE: dexie
          VITE_BUILD_BRANCH: ${{ github.ref_name }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          VITE_IS_PREVIEW: "true"
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
      - name: Publish compiled preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./frontend/dist
          force_orphan: true
