name: CI audit validation 2026-10-04

# Temporary validation harness for the 2026-10-04 scheduled-workflow repair.

on:
  push:
    branches:
      - fix/ci-audit-20261004
    paths:
      - .github/workflows/ci-validation-20261004.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-red-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-audit-20261004

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Verify theme gates
        id: theme
        continue-on-error: true
        run: make verify-theme

      - name: Run smoke suite
        id: smoke
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test --project=smoke

      - name: Run manual-automation suite
        id: manual
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test --project=manual-automation --retries=1

      - name: Run visual regression
        id: visual
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test --project=visual --retries=1

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-audit-validation-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if any validation family failed
        run: |
          echo "theme=${{ steps.theme.outcome }}"
          echo "smoke=${{ steps.smoke.outcome }}"
          echo "manual=${{ steps.manual.outcome }}"
          echo "visual=${{ steps.visual.outcome }}"
          test "${{ steps.theme.outcome }}" = "success"
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.manual.outcome }}" = "success"
          test "${{ steps.visual.outcome }}" = "success"
