name: CI audit targeted validation 2026-10-04

on:
  push:
    branches:
      - fix/ci-audit-20261004
    paths:
      - .github/workflows/ci-targeted-validation-20261004.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-previous-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-audit-20261004

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run previously failing smoke specs
        id: smoke
        continue-on-error: true
        working-directory: e2e
        run: |
          npx playwright test --project=smoke \
            smoke/a11y-audit.spec.ts \
            smoke/ai-template-roundtrip.spec.ts \
            smoke/article-topic-seo.spec.ts \
            smoke/donation-reminder-app-level.spec.ts \
            smoke/editor-display-settings.spec.ts \
            smoke/editor-formatting.spec.ts \
            smoke/editor-fullscreen.spec.ts \
            smoke/learnset-export.spec.ts \
            smoke/mobile-header-brand-recent-docs.spec.ts \
            smoke/offline-pwa.spec.ts \
            smoke/picture-book-editor.spec.ts \
            smoke/reclassify.spec.ts \
            smoke/share-app.spec.ts \
            smoke/themes.spec.ts

      - name: Run previously failing manual specs
        id: manual
        continue-on-error: true
        working-directory: e2e
        run: |
          npx playwright test --project=manual-automation --retries=1 \
            manual-automation/section4-backup.spec.ts \
            manual-automation/section5-settings.spec.ts

      - name: Run previously failing visual specs
        id: visual
        continue-on-error: true
        working-directory: e2e
        run: |
          npx playwright test --project=visual --retries=1 \
            visual/theme-regression.spec.ts \
            visual/viewport-regression.spec.ts

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-audit-targeted-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if a repaired family is still red
        run: |
          echo "smoke=${{ steps.smoke.outcome }}"
          echo "manual=${{ steps.manual.outcome }}"
          echo "visual=${{ steps.visual.outcome }}"
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.manual.outcome }}" = "success"
          test "${{ steps.visual.outcome }}" = "success"
