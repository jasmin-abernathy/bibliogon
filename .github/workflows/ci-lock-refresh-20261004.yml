name: CI targeted lock refresh 2026-10-04

on:
  push:
    branches:
      - fix/ci-audit-20261004
    paths:
      - .github/workflows/ci-lock-refresh-20261004.yml

permissions:
  contents: write

jobs:
  refresh-python-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-audit-20261004
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Refresh only vulnerable Python packages
        working-directory: backend
        run: poetry update anyio gitpython soupsieve urllib3 virtualenv --lock
      - name: Validate Python security scan
        working-directory: backend
        run: |
          poetry install --no-interaction --no-ansi
          poetry run python -m pip install --upgrade "pip>=26.2"
          IGNORE=$(poetry run python ../scripts/security_ignore_args.py)
          poetry run pip-audit --skip-editable $IGNORE
      - name: Commit targeted Python lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/poetry.lock
          if git diff --cached --quiet; then
            echo "No Python lockfile changes required."
            exit 0
          fi
          git commit -m "chore(security): refresh vulnerable Python locks [skip ci]"
          git push origin HEAD:fix/ci-audit-20261004
